<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday!</title>
<style>
  /* Base64 Custom Pixel Pointer Cursor */
  *, *::before, *::after {
    cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24' shape-rendering='crispEdges'><path d='M3 1h1v20H3z M4 2h1v18H4z M5 3h1v16H5z M6 4h1v14H6z M7 5h1v12H7z M8 6h1v10H8z M9 7h1v8H9z M10 8h1v6H10z M11 9h1v4H11z M12 10h1v2H12z M10 14h2v7h-2z M12 16h2v5h-2z' fill='%23ffffff'/><path d='M2 0h2v22H2z M4 21h4v2H4z M7 18h2v3H7z M9 15h3v2H9z M12 17h2v5h-2z M14 17h2v4h-2z M4 1h1v1H4z M5 2h1v1H5z M6 3h1v1H6z M7 4h1v1H7z M8 5h1v1H8z M9 6h1v1H9z M10 7h1v1H10z M11 8h1v1H11z M12 9h1v1H12z M13 10h1v1H13z M14 11h1v1H14z M15 12h2v2h-2z M14 13h1v1h-1z M13 14h1v1h-1z M12 15h1v1h-1z' fill='%23000000'/></svg>") 0 0, auto !important;
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    font-family: "Tahoma", "MS Sans Serif", sans-serif;
    user-select: none;
    -webkit-user-select: none;
    /* Bliss Wallpaper Background */
    background: #0055ea url("211174977272346.jpeg") center center / cover no-repeat;
  }

  #stage {
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  /* ----------------- System Message Dialog Box ----------------- */
  #sysDialog {
    position: absolute;
    width: 380px;
    background: #ece9d8;
    border: 3px solid #0055ea;
    border-radius: 3px;
    box-shadow: 4px 6px 18px rgba(0, 0, 0, 0.45);
    z-index: 50;
    transition: opacity 0.25s ease, transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }

  #sysDialog.hidden {
    opacity: 0;
    transform: scale(0.7) translateY(30px);
    pointer-events: none;
  }

  .dialog-title {
    background: linear-gradient(90deg, #0a246a 0%, #a6caf0 100%);
    color: #fff;
    font-size: 13px;
    font-weight: bold;
    padding: 4px 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .dialog-close {
    background: #d93829;
    color: white;
    border: 1px solid #fff;
    width: 17px;
    height: 17px;
    line-height: 13px;
    font-size: 11px;
    text-align: center;
    border-radius: 2px;
    font-weight: bold;
    cursor: pointer !important;
  }

  .dialog-close:hover {
    background: #e65545;
  }

  .dialog-content {
    padding: 30px 16px;
    text-align: center;
    font-family: 'Courier New', Courier, monospace;
    font-size: 21px;
    font-weight: bold;
    color: #000;
  }

  .dialog-actions {
    display: flex;
    justify-content: center;
    gap: 22px;
    padding-bottom: 24px;
  }

  .win-btn {
    background: #ece9d8;
    font-family: 'Courier New', Courier, monospace;
    font-size: 15px;
    font-weight: bold;
    padding: 6px 22px;
    border: 2px solid;
    border-color: #ffffff #808080 #808080 #ffffff;
    box-shadow: 1px 1px 0px #000000;
    outline: none;
    transition: transform 0.08s ease, box-shadow 0.08s ease;
  }

  .win-btn:hover {
    background: #f5f4ec;
    transform: translateY(-2px);
    box-shadow: 2px 3px 0px #000000;
  }

  .win-btn:active, .win-btn.pressed {
    border-color: #808080 #ffffff #ffffff #808080;
    transform: translateY(2px) scale(0.96);
    box-shadow: 0px 0px 0px #000000;
  }

  /* ----------------- Video Player Container ----------------- */
  #playerContainer {
    position: relative;
    width: 600px;
    max-width: 92vw;
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.65);
    border-radius: 6px;
    overflow: hidden;
    background: #000;
    display: none;
    opacity: 0;
    transform: scale(0.95);
    transition: opacity 0.3s ease, transform 0.3s ease;
    z-index: 20;
  }

  #playerContainer.active {
    display: block;
    opacity: 1;
    transform: scale(1);
  }

  /* Top Right "X" Close Button over the player window */
  .player-close-x {
    position: absolute;
    top: 6px;
    right: 8px;
    width: 22px;
    height: 22px;
    background: #cc3322;
    border: 1px solid #ffffffa1;
    border-radius: 3px;
    color: white;
    font-size: 13px;
    font-weight: bold;
    line-height: 19px;
    text-align: center;
    z-index: 35;
    cursor: pointer !important;
    transition: background 0.15s ease, transform 0.1s ease;
  }

  .player-close-x:hover {
    background: #ff4433;
    transform: scale(1.05);
  }

  .player-close-x:active {
    transform: scale(0.95);
  }

  video {
    width: 100%;
    display: block;
    cursor: pointer !important;
  }

  /* Pause Indicator Overlay */
  #pauseBadge {
    position: absolute;
    top: 14px;
    left: 14px;
    background: rgba(0, 0, 0, 0.75);
    border: 1px solid #5588cc;
    color: #ffd700;
    font-size: 12px;
    padding: 3px 10px;
    border-radius: 3px;
    font-weight: bold;
    pointer-events: none;
    display: none;
    z-index: 30;
  }

  #pauseBadge.visible {
    display: block;
  }

  /* ----------------- Replay Button Overlay ----------------- */
  #replayBtn {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.85);
    background: #ece9d8;
    border: 3px solid;
    border-color: #ffffff #808080 #808080 #ffffff;
    box-shadow: 2px 3px 12px rgba(0,0,0,0.7);
    padding: 10px 22px;
    display: none;
    align-items: center;
    gap: 10px;
    font-family: 'Courier New', Courier, monospace;
    font-size: 17px;
    font-weight: bold;
    color: #000;
    opacity: 0;
    transition: opacity 0.25s ease, transform 0.15s ease, background 0.15s ease;
    z-index: 40;
    cursor: pointer !important;
  }

  #replayBtn.visible {
    display: flex;
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }

  #replayBtn:hover {
    transform: translate(-50%, -50%) scale(1.08);
    background: #f7f6f0;
  }

  #replayBtn:active {
    border-color: #808080 #ffffff #ffffff #808080;
    transform: translate(-50%, -50%) scale(0.96);
  }

  .replay-icon {
    font-size: 22px;
    line-height: 1;
    transform: rotate(-45deg);
    display: inline-block;
  }

  /* ----------------- Falling "Happy Birthday" Text ----------------- */
  #bdayText {
    position: absolute;
    top: -200px;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'Impact', 'Arial Black', sans-serif;
    font-size: 60px;
    font-weight: 900;
    color: #ffd700;
    text-shadow: 3px 3px 0px #e60000, -3px -3px 0px #0058ee, 4px 6px 14px rgba(0,0,0,0.8);
    white-space: nowrap;
    z-index: 100;
    pointer-events: none;
  }

  @keyframes dropAndFall {
    0% { top: 8%; transform: translateX(-50%) scale(0.2); opacity: 0; }
    25% { top: 38%; transform: translateX(-50%) scale(1.15) rotate(-3deg); opacity: 1; }
    35% { top: 38%; transform: translateX(-50%) scale(1) rotate(2deg); opacity: 1; }
    65% { top: 46%; transform: translateX(-50%) scale(1.05) rotate(0deg); opacity: 1; }
    100% { top: 115vh; transform: translateX(-50%) scale(0.9) rotate(8deg); opacity: 0; }
  }

  .animate-drop {
    animation: dropAndFall 4s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
  }

  /* Fullscreen Confetti Canvas */
  #confettiCanvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    pointer-events: none;
    z-index: 90;
  }
</style>
</head>
<body>

<canvas id="confettiCanvas"></canvas>

<div id="stage">
  <!-- System Message -->
  <div id="sysDialog">
    <div class="dialog-title">
      <span>System message</span>
      <div class="dialog-close" id="dialogCloseBtn" title="Close">✕</div>
    </div>
    <div class="dialog-content">
      Is it your birthday?
    </div>
    <div class="dialog-actions">
      <button class="win-btn" id="btn1">Yes</button>
      <button class="win-btn" id="btn2">Hell yes</button>
    </div>
  </div>

  <!-- Windows Media Player Video Window -->
  <div id="playerContainer">
    <!-- Clickable "X" Button to close and return to system message -->
    <div class="player-close-x" id="playerCloseX" title="Exit & Return">✕</div>
    
    <!-- Status badge when paused -->
    <div id="pauseBadge">❚❚ PAUSED</div>

    <!-- Video Element (click anywhere on video to pause/unpause) -->
    <video id="vid" src="Video Project 239.mp4" playsinline preload="auto"></video>

    <!-- Retro Replay Button -->
    <div id="replayBtn" title="Replay">
      <span class="replay-icon">↺</span>
      <span>Replay</span>
    </div>
  </div>

  <div id="bdayText">HAPPY BIRTHDAY! 🎂</div>
</div>

<script>
  const vid = document.getElementById('vid');
  const sysDialog = document.getElementById('sysDialog');
  const playerContainer = document.getElementById('playerContainer');
  const btn1 = document.getElementById('btn1');
  const btn2 = document.getElementById('btn2');
  const replayBtn = document.getElementById('replayBtn');
  const bdayText = document.getElementById('bdayText');
  const playerCloseX = document.getElementById('playerCloseX');
  const dialogCloseBtn = document.getElementById('dialogCloseBtn');
  const pauseBadge = document.getElementById('pauseBadge');

  // Confetti setup
  const canvas = document.getElementById('confettiCanvas');
  const ctx = canvas.getContext('2d');
  function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
  window.addEventListener('resize', resize);
  resize();

  // Reset to initial screen
  function resetToBeginning() {
    vid.pause();
    vid.currentTime = 0;
    pauseBadge.classList.remove('visible');
    replayBtn.classList.remove('visible');
    bdayText.classList.remove('animate-drop');
    playerContainer.classList.remove('active');
    btn1.classList.remove('pressed');
    btn2.classList.remove('pressed');
    sysDialog.classList.remove('hidden');
    stopConfetti();
  }

  // Clicking the dialog "X" resets or shakes dialog
  dialogCloseBtn.addEventListener('click', () => {
    sysDialog.style.transform = 'translate(-4px, 0)';
    setTimeout(() => sysDialog.style.transform = 'translate(4px, 0)', 80);
    setTimeout(() => sysDialog.style.transform = 'translate(0, 0)', 160);
  });

  // Clicking the player "X" closes player and returns to opening screen
  playerCloseX.addEventListener('click', (e) => {
    e.stopPropagation();
    resetToBeginning();
  });

  // Start Experience
  function triggerOpen(btn) {
    btn.classList.add('pressed');
    setTimeout(() => {
      sysDialog.classList.add('hidden');
      playerContainer.classList.add('active');
      replayBtn.classList.remove('visible');
      pauseBadge.classList.remove('visible');
      vid.currentTime = 0;
      vid.play().catch(e => console.warn("Playback error:", e));
    }, 240);
  }

  btn1.addEventListener('click', () => triggerOpen(btn1));
  btn2.addEventListener('click', () => triggerOpen(btn2));

  // Toggle Pause/Play on clicking the video screen
  vid.addEventListener('click', () => {
    if (vid.ended) return;
    if (vid.paused) {
      vid.play();
      pauseBadge.classList.remove('visible');
    } else {
      vid.pause();
      pauseBadge.classList.add('visible');
    }
  });

  // Video End Sequence
  vid.addEventListener('ended', () => {
    pauseBadge.classList.remove('visible');
    startConfetti();
    
    bdayText.classList.remove('animate-drop');
    void bdayText.offsetWidth;
    bdayText.classList.add('animate-drop');

    setTimeout(() => {
      replayBtn.classList.add('visible');
    }, 1500);
  });

  // Replay Button restarts the video
  replayBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    replayBtn.classList.remove('visible');
    bdayText.classList.remove('animate-drop');
    stopConfetti();
    vid.currentTime = 0;
    vid.play();
  });

  // Confetti Engine
  let particles = [];
  let confettiAnim = null;

  function startConfetti() {
    const cols = ['#ff2a2a', '#ffd700', '#00e5ff', '#ff00ea', '#44ff44', '#ffffff', '#ff9100'];
    particles = [];
    for (let i = 0; i < 160; i++) {
      particles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * -canvas.height * 0.6,
        s: Math.random() * 8 + 6,
        vx: Math.random() * 4 - 2,
        vy: Math.random() * 4 + 3,
        rot: Math.random() * 360,
        vr: Math.random() * 8 - 4,
        c: cols[Math.floor(Math.random() * cols.length)]
      });
    }
    if (confettiAnim) cancelAnimationFrame(confettiAnim);
    renderConfetti();
  }

  function stopConfetti() {
    if (confettiAnim) cancelAnimationFrame(confettiAnim);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles = [];
  }

  function renderConfetti() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    let active = false;
    for (let p of particles) {
      p.y += p.vy;
      p.x += Math.sin(p.y * 0.02) * 2 + p.vx;
      p.rot += p.vr;
      if (p.y < canvas.height + 20) active = true;

      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate((p.rot * Math.PI) / 180);
      ctx.fillStyle = p.c;
      ctx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * 0.6);
      ctx.restore();
    }
    if (active) confettiAnim = requestAnimationFrame(renderConfetti);
    else stopConfetti();
  }
</script>
</body>
</html>
