<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday!</title>
<style>
  /* 1. Custom Pixel Cursor from your uploaded asset */
  *, *::before, *::after {
    cursor: url("2674081025828006.jpeg") 0 0, auto !important;
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    font-family: 'Tahoma', sans-serif;
    /* 2. Bliss Wallpaper Background from your uploaded asset */
    background: #0055ea url("211174977272346.jpeg") center center / cover no-repeat;
  }

  #stage {
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  /* ---------------- 3. Authentic System Message Dialog ---------------- */
  #sysDialog {
    position: absolute;
    width: 380px;
    height: 242px;
    background: url("●●.png") no-repeat center center / contain;
    box-shadow: 6px 8px 24px rgba(0,0,0,0.55);
    z-index: 50;
    transition: opacity 0.25s ease, transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }

  #sysDialog.hidden {
    opacity: 0;
    transform: scale(0.7) translateY(30px);
    pointer-events: none;
  }

  /* Invisible clickable button hitboxes matching the buttons in ●●.png */
  .hitbox-yes, .hitbox-hellyes {
    position: absolute;
    bottom: 24px;
    height: 38px;
    background: rgba(255, 255, 255, 0.01);
    border: none;
    outline: none;
    transition: transform 0.08s ease, filter 0.08s ease;
  }

  .hitbox-yes {
    left: 65px;
    width: 115px;
  }

  .hitbox-hellyes {
    right: 68px;
    width: 115px;
  }

  .hitbox-yes:hover, .hitbox-hellyes:hover {
    background: rgba(255, 255, 255, 0.15);
    filter: brightness(1.08);
  }

  .hitbox-yes:active, .hitbox-hellyes:active {
    transform: scale(0.96);
    background: rgba(0, 0, 0, 0.15);
  }

  /* ---------------- 4. Standalone Video Display ---------------- */
  #videoWrapper {
    position: relative;
    width: 580px;
    max-width: 92vw;
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.65);
    border-radius: 6px;
    overflow: hidden;
    background: #000;
    display: none;
    opacity: 0;
    transform: scale(0.95);
    transition: opacity 0.3s ease, transform 0.3s ease;
    z-index: 20;
  }

  #videoWrapper.active {
    display: block;
    opacity: 1;
    transform: scale(1);
  }

  video {
    width: 100%;
    display: block;
  }

  /* ---------------- 5. Pixelated Play Button Asset ---------------- */
  #playAgainBtn {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.85);
    width: 80px;
    height: 80px;
    background: #ffffff;
    border: 3px solid #000;
    box-shadow: 0 8px 24px rgba(0,0,0,0.7);
    display: none;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity 0.25s ease, transform 0.15s ease;
    z-index: 40;
  }

  #playAgainBtn.visible {
    display: flex;
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }

  #playAgainBtn:hover {
    transform: translate(-50%, -50%) scale(1.1);
  }

  #playAgainBtn img {
    width: 64px;
    height: 64px;
    image-rendering: pixelated;
    display: block;
  }

  /* ---------------- Falling Birthday Text ---------------- */
  #bdayText {
    position: absolute;
    top: -200px;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'Impact', 'Arial Black', sans-serif;
    font-size: 58px;
    font-weight: 900;
    color: #ffd700;
    text-shadow: 3px 3px 0px #e60000, -3px -3px 0px #0058ee, 4px 6px 14px rgba(0,0,0,0.8);
    white-space: nowrap;
    z-index: 100;
    pointer-events: none;
  }

  @keyframes dropAndFall {
    0% { top: 8%; transform: translateX(-50%) scale(0.2); opacity: 0; }
    25% { top: 38%; transform: translateX(-50%) scale(1.15) rotate(-3deg); opacity: 1; }
    35% { top: 38%; transform: translateX(-50%) scale(1) rotate(2deg); opacity: 1; }
    65% { top: 46%; transform: translateX(-50%) scale(1.05) rotate(0deg); opacity: 1; }
    100% { top: 115vh; transform: translateX(-50%) scale(0.9) rotate(8deg); opacity: 0; }
  }

  .animate-drop {
    animation: dropAndFall 4s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
  }

  #confettiCanvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    pointer-events: none;
    z-index: 90;
  }
</style>
</head>
<body>

<canvas id="confettiCanvas"></canvas>

<div id="stage">
  <!-- System Message Image Box -->
  <div id="sysDialog">
    <button class="hitbox-yes" id="btnYes" title="Yes"></button>
    <button class="hitbox-hellyes" id="btnHellYes" title="Hell yes"></button>
  </div>

  <!-- Windows Media Player Video -->
  <div id="videoWrapper">
    <video id="vid" src="Video Project 239.mp4" playsinline preload="auto"></video>
    <div id="playAgainBtn" title="Play Again">
      <!-- Your uploaded pixel play button file -->
      <img src="Play button pixelated ui icon_ Music player bar….jpeg" alt="Play Again">
    </div>
  </div>

  <div id="bdayText">HAPPY BIRTHDAY! 🎂</div>
</div>

<script>
  const vid = document.getElementById('vid');
  const sysDialog = document.getElementById('sysDialog');
  const videoWrapper = document.getElementById('videoWrapper');
  const btnYes = document.getElementById('btnYes');
  const btnHellYes = document.getElementById('btnHellYes');
  const playAgainBtn = document.getElementById('playAgainBtn');
  const bdayText = document.getElementById('bdayText');

  // Confetti setup
  const canvas = document.getElementById('confettiCanvas');
  const ctx = canvas.getContext('2d');
  function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
  window.addEventListener('resize', resize);
  resize();

  function triggerOpen() {
    sysDialog.classList.add('hidden');
    videoWrapper.classList.add('active');
    vid.currentTime = 0;
    vid.play().catch(e => console.warn("Playback error:", e));
  }

  btnYes.addEventListener('click', triggerOpen);
  btnHellYes.addEventListener('click', triggerOpen);

  vid.addEventListener('ended', () => {
    startConfetti();
    
    bdayText.classList.remove('animate-drop');
    void bdayText.offsetWidth;
    bdayText.classList.add('animate-drop');

    setTimeout(() => {
      playAgainBtn.classList.add('visible');
    }, 1500);
  });

  playAgainBtn.addEventListener('click', () => {
    playAgainBtn.classList.remove('visible');
    bdayText.classList.remove('animate-drop');
    videoWrapper.classList.remove('active');

    vid.pause();
    vid.currentTime = 0;

    sysDialog.classList.remove('hidden');
  });

  // Confetti animation
  let particles = [];
  function startConfetti() {
    const cols = ['#ff2a2a', '#ffd700', '#00e5ff', '#ff00ea', '#44ff44', '#ffffff', '#ff9100'];
    particles = [];
    for (let i = 0; i < 160; i++) {
      particles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * -canvas.height * 0.6,
        s: Math.random() * 8 + 6,
        vx: Math.random() * 4 - 2,
        vy: Math.random() * 4 + 3,
        rot: Math.random() * 360,
        vr: Math.random() * 8 - 4,
        c: cols[Math.floor(Math.random() * cols.length)]
      });
    }
    renderConfetti();
  }

  function renderConfetti() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    let active = false;
    for (let p of particles) {
      p.y += p.vy;
      p.x += Math.sin(p.y * 0.02) * 2 + p.vx;
      p.rot += p.vr;
      if (p.y < canvas.height + 20) active = true;

      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate((p.rot * Math.PI) / 180);
      ctx.fillStyle = p.c;
      ctx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * 0.6);
      ctx.restore();
    }
    if (active) requestAnimationFrame(renderConfetti);
    else ctx.clearRect(0, 0, canvas.width, canvas.height);
  }
</script>
</body>
</html>
